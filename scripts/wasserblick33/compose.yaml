name: solve-water33

services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: solve33
      POSTGRES_DB: solve33
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env with python init_env.py first}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solve33 -d solve33"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  neo4j:
    image: neo4j:2026.10.1
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Create .env with python init_env.py first}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  tools:
    profiles: ["tools"]
    build: .
    working_dir: /app
    volumes:
      - ${SOLVE33_DATA_DIR:-./data}:/data
    environment:
      SOLVE_DATABASE_URL: postgresql://solve33:${POSTGRES_PASSWORD:?Create .env first}@postgres:5432/solve33
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Create .env first}
      NEO4J_DATABASE: neo4j
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    command: ["python", "pg_import.py", "--help"]

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
